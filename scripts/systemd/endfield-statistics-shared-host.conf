# Install as endfield-statistics.service.d/serialization.conf on the shared host.
# Use the same lock as the personal analysis service, without waiting behind it.
[Service]
TimeoutStartSec=8min
ExecStart=
ExecStart=/usr/bin/flock -n -E 0 /run/lock/endfield-analysis-workers.lock /usr/bin/docker run --rm --name endfield-statistics-worker --network host --memory=1200m --memory-swap=1200m --cpus=1 --cpu-shares=128 --read-only --cap-drop=ALL --security-opt=no-new-privileges --user 65534:65534 --env-file /etc/endfield/statistics.env -e STATISTICS_MAX_JOBS=500 -v /opt/endfield-statistics:/app:ro node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 node --max-old-space-size=768 /app/worker.mjs
